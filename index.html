<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Unit Price</title>
  <meta name="referrer" content="same-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      --bg-from: #eef2ff;
      --bg-to: #e0f2fe;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #4f46e5;
      --accent-contrast: #ffffff;
      --best-bg: #ecfdf5;
      --best-border: #10b981;
      --best-text: #047857;
      --shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.18);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-from: #0f172a;
        --bg-to: #111827;
        --surface: #1e293b;
        --border: #334155;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #818cf8;
        --accent-contrast: #0f172a;
        --best-bg: #064e3b;
        --best-border: #34d399;
        --best-text: #6ee7b7;
        --shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.5);
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(160deg, var(--bg-from), var(--bg-to));
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px 48px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 32px 24px 28px;
    }

    h1 {
      margin: 0 0 4px;
      text-align: center;
      font-weight: 700;
      color: var(--text);
      font-size: clamp(20px, 5.5vw, 26px);
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: clamp(12px, 3.2vw, 14px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px 8px;
    }

    .grid-header span {
      display: block;
      text-align: center;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: clamp(10px, 2.8vw, 12px);
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .row {
      display: contents;
    }

    .input,
    .result {
      width: 100%;
      min-width: 0;
      height: 44px;
      border-radius: 10px;
      text-align: center;
    }

    .input {
      -webkit-appearance: none;
      appearance: textfield;
      border: 1.5px solid var(--border);
      background-color: var(--surface);
      color: var(--text);
      font-size: clamp(13px, 3.6vw, 15px);
      padding: 0 6px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input::placeholder {
      color: var(--muted);
      opacity: 0.7;
    }

    .input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    }

    .input::-webkit-outer-spin-button,
    .input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .result {
      display: flex;
      align-items: center;
      justify-content: center;
      background: color-mix(in srgb, var(--border) 35%, transparent);
      border: 1.5px solid transparent;
      font-weight: 700;
      font-size: clamp(13px, 3.8vw, 17px);
      color: var(--text);
      margin: 0;
      padding: 0 4px;
      word-break: break-all;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .result.best {
      background: var(--best-bg);
      border-color: var(--best-border);
      color: var(--best-text);
    }

    #btn-reset {
      display: block;
      width: fit-content;
      margin: 24px auto 0;
      padding: 8px 22px;
      border: 1.5px solid var(--accent);
      border-radius: 999px;
      background: transparent;
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s ease, color 0.15s ease;
    }

    #btn-reset:hover,
    #btn-reset:active {
      background: var(--accent);
      color: var(--accent-contrast);
    }

    footer {
      text-align: center;
      padding: 20px;
    }

    footer a {
      font-size: 13px;
      color: var(--muted);
      text-decoration: underline;
    }

    @media (max-width: 360px) {
      .grid {
        gap: 6px;
      }

      .card {
        padding: 24px 16px 24px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="card">
      <h1>Price for the unit</h1>
      <p class="subtitle">Compare items by price per kg, liter, or any unit</p>

      <div class="grid">
        <div class="grid-header">
          <span>Price</span>
        </div>
        <div class="grid-header">
          <span>Quantity</span>
        </div>
        <div class="grid-header">
          <span>Real&nbsp;price</span>
        </div>

        <div class="row">
          <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="Price1" name="Price1" class="input" id="price1" />
          <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="kg/L/..." name="q1" class="input" id="q1" />
          <p class="result" id="res1"></p>
        </div>
        <div class="row">
          <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="Price2" name="Price2" class="input" id="price2" />
          <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="kg/L/..." name="q2" class="input" id="q2" />
          <p class="result" id="res2"></p>
        </div>
        <div class="row">
          <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="Price3" name="Price3" class="input" id="price3" />
          <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="kg/L/..." name="q3" class="input" id="q3" />
          <p class="result" id="res3"></p>
        </div>
        <div class="row">
          <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="Price4" name="Price4" class="input" id="price4" />
          <input type="text" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="kg/L/..." name="q4" class="input" id="q4" />
          <p class="result" id="res4"></p>
        </div>
      </div>

      <p id="btn-reset">Reset</p>
    </div>
  </main>

  <footer>
    <a href="javascript:em1();">Contact</a>
  </footer>

  <script src="./js/app.js"></script>
  <script>
    !(function () {
      var s = ["js/jquery.js", "js/index.20200514140507.js"],
        n = {},
        j = 0,
        e = function (e) {
          var o = new XMLHttpRequest();
          o.open("GET", s[e], !0),
            (o.onload = function () {
              if (((n[e] = o.responseText), 2 == ++j))
                for (var t in s) {
                  var i = document.createElement("script");
                  (i.textContent = n[t]), document.body.appendChild(i);
                }
            }),
            o.send();
        };
      for (var o in s) e(o);
    })();
  </script>
</body>

</html>
