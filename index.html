<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Unit Price</title>
  <meta name="referrer" content="same-origin" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    @font-face {
      font-family: "Baloo Da";
      src: url("css/BalooDa-Regular.woff2") format("woff2"),
        url("css/BalooDa-Regular.woff") format("woff");
      font-weight: 400;
    }

    @font-face {
      font-family: "Advent Pro";
      src: url("css/AdventPro-Bold.woff2") format("woff2"),
        url("css/AdventPro-Bold.woff") format("woff");
      font-weight: 700;
    }

    @font-face {
      font-family: "ABeeZee";
      src: url("css/ABeeZee-Regular.woff2") format("woff2"),
        url("css/ABeeZee-Regular.woff") format("woff");
      font-weight: 400;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0a77f4 url(images/use_your_illusion.png) repeat center top;
      font-family: "ABeeZee", sans-serif;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      padding: 24px 16px 48px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: #2aa198 url(images/brushed_alu.png) repeat center top;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      padding: 24px 20px 32px;
    }

    h1 {
      margin: 0 0 20px;
      text-align: center;
      font-family: "Baloo Da", sans-serif;
      font-weight: 400;
      color: #0a77f4;
      font-size: clamp(22px, 6vw, 30px);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px 10px;
    }

    .grid-header span {
      display: block;
      text-align: center;
      font-family: "Baloo Da", sans-serif;
      color: #0a77f4;
      font-size: clamp(12px, 3.2vw, 15px);
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .row {
      display: contents;
    }

    .input,
    .result {
      width: 100%;
      min-width: 0;
      height: 44px;
      box-sizing: border-box;
      border-radius: 4px;
      text-align: center;
    }

    .input {
      -webkit-appearance: none;
      appearance: textfield;
      border: 1px solid #c0c0c0;
      background-color: #fff;
      font-family: "Baloo Da", sans-serif;
      font-size: clamp(13px, 3.6vw, 16px);
      color: #000;
      padding: 0 6px;
    }

    .input::-webkit-outer-spin-button,
    .input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .result {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #8df900;
      border: 1px solid #677a85;
      font-family: "Advent Pro", sans-serif;
      font-weight: 700;
      font-size: clamp(14px, 4vw, 20px);
      color: #000;
      padding: 0 4px;
      word-break: break-all;
    }

    #btn-reset {
      display: block;
      width: fit-content;
      margin: 24px auto 0;
      padding: 8px 24px;
      border: 1px solid #0a77f4;
      border-radius: 4px;
      background: #fff;
      color: #0a77f4;
      font-family: "Baloo Da", sans-serif;
      font-size: 16px;
      letter-spacing: 1.1px;
      cursor: pointer;
      user-select: none;
    }

    #btn-reset:hover,
    #btn-reset:active {
      background: #0a77f4;
      color: #fff;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #0a77f4 url(images/low_contrast_linen.png) repeat center top;
    }

    footer a {
      font-family: "ABeeZee", sans-serif;
      font-size: 14px;
      color: #b8c8d2;
      text-decoration: underline;
    }

    @media (max-width: 360px) {
      .grid {
        gap: 6px;
      }

      .card {
        padding: 20px 12px 28px;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="card">
      <h1>Price for the unit</h1>

      <div class="grid">
        <div class="grid-header">
          <span>Price</span>
        </div>
        <div class="grid-header">
          <span>Quantity</span>
        </div>
        <div class="grid-header">
          <span>REAL&nbsp;PRICE</span>
        </div>

        <div class="row">
          <input type="number" inputmode="decimal" placeholder="Price1" name="Price1" class="input" id="price1" />
          <input type="number" inputmode="decimal" placeholder="kg/L/..." name="q1" class="input" id="q1" />
          <p class="result" id="res1"></p>
        </div>
        <div class="row">
          <input type="number" inputmode="decimal" placeholder="Price2" name="Price2" class="input" id="price2" />
          <input type="number" inputmode="decimal" placeholder="kg/L/..." name="q2" class="input" id="q2" />
          <p class="result" id="res2"></p>
        </div>
        <div class="row">
          <input type="number" inputmode="decimal" placeholder="Price3" name="Price3" class="input" id="price3" />
          <input type="number" inputmode="decimal" placeholder="kg/L/..." name="q3" class="input" id="q3" />
          <p class="result" id="res3"></p>
        </div>
        <div class="row">
          <input type="number" inputmode="decimal" placeholder="Price4" name="Price4" class="input" id="price4" />
          <input type="number" inputmode="decimal" placeholder="kg/L/..." name="q4" class="input" id="q4" />
          <p class="result" id="res4"></p>
        </div>
      </div>

      <p id="btn-reset">Reset</p>
    </div>
  </main>

  <footer>
    <a href="javascript:em1();">Contact</a>
  </footer>

  <script src="./js/app.js"></script>
  <script>
    !(function () {
      var s = ["js/jquery.js", "js/index.20200514140507.js"],
        n = {},
        j = 0,
        e = function (e) {
          var o = new XMLHttpRequest();
          o.open("GET", s[e], !0),
            (o.onload = function () {
              if (((n[e] = o.responseText), 2 == ++j))
                for (var t in s) {
                  var i = document.createElement("script");
                  (i.textContent = n[t]), document.body.appendChild(i);
                }
            }),
            o.send();
        };
      for (var o in s) e(o);
    })();
  </script>
</body>

</html>
